[project]
name = "fin-intel"
version = "0.1.0"
description = "Financial data backend aggregating free data sources"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
fin-intel = "fin_intel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Always use uv's own Python builds (version pinned in .python-version), so every machine,
# including servers with an older system Python, runs the same interpreter.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
