# The server's services: PostgreSQL, the API, and the scheduled jobs. The image holds only
# the code; everything that differs between machines comes from .env (documented in
# .env.example), with the defaults below. Data stays on the host: the database in
# FI_PG_DATA, the raw responses in ./data/raw. See deploy/README.md.
name: fin-intel

x-app: &app
  image: fin-intel:latest
  restart: unless-stopped
  user: "${APP_UID:-1002}:${APP_GID:-1002}"
  env_file: .env
  environment: &app-env
    FI_DATABASE_URL: postgresql+psycopg://finintel:${FI_PG_PASSWORD:?set FI_PG_PASSWORD in .env}@postgres/fin_intel
    FI_RAW_DIR: data/raw
    # For pg_dump in deploy/backup.sh
    PGHOST: postgres
    PGUSER: finintel
    PGPASSWORD: ${FI_PG_PASSWORD}
  volumes:
    - ./data/raw:/app/data/raw
  # Nothing in the image is written at run time: only the raw store and /tmp.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres:
      condition: service_healthy
  logging: &logging
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    image: ${FI_PG_IMAGE:-postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d}
    restart: unless-stopped
    # The data directory's owner on the host (the server's original cluster is owned by the
    # host's postgres user).
    user: "${PG_UID:-999}:${PG_GID:-999}"
    # Memory settings here so they follow the machine (.env); the rest is in the file.
    command: >-
      postgres -c config_file=/etc/postgresql/postgresql.conf
               -c hba_file=/etc/postgresql/pg_hba.conf
               -c shared_buffers=${PG_SHARED_BUFFERS:-2GB}
               -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-7GB}
               -c work_mem=${PG_WORK_MEM:-64MB}
               -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
               -c max_wal_size=${PG_MAX_WAL_SIZE:-8GB}
    environment:
      POSTGRES_USER: finintel
      POSTGRES_PASSWORD: ${FI_PG_PASSWORD}
      POSTGRES_DB: fin_intel
      # As the server's cluster: code-point order, the same under every glibc version
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - ${FI_PG_DATA:-./data/postgres}:/var/lib/postgresql/data
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: ${PG_SHM_SIZE:-1g}
    mem_limit: ${PG_MEMORY:-0}
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "finintel", "-d", "fin_intel"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  api:
    <<: *app
    # Builds the image the other app services share (one build, not one per service)
    build:
      context: .
      args:
        CODE_VERSION: ${CODE_VERSION:-}
    command: ["fin-intel", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${FI_API_BIND:-127.0.0.1}:${FI_API_PORT:-8000}:8000"
    mem_limit: ${FI_API_MEMORY:-1g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cron:
    <<: *app
    command: ["/app/deploy/cron.sh"]
    environment:
      <<: *app-env
      RCLONE_CONFIG: /config/rclone/rclone.conf
      FI_SCHEDULE_DAILY: ${FI_SCHEDULE_DAILY-30 23 * * 1-5}
      FI_SCHEDULE_WEEKLY: ${FI_SCHEDULE_WEEKLY-0 6 * * 0}
      FI_SCHEDULE_NEWS: ${FI_SCHEDULE_NEWS-17 * * * *}
      FI_SCHEDULE_BACKUP: ${FI_SCHEDULE_BACKUP-0 4 * * *}
      # Runs whatever is due or due for a retry (empty: nothing runs on its own)
      FI_SCHEDULE_RECONCILE: ${FI_SCHEDULE_RECONCILE-*/10 * * * *}
    volumes:
      - ./data/raw:/app/data/raw
      - ${RCLONE_CONFIG_DIR:-~/.config/rclone}:/config/rclone:ro
    # Also the limit of one-off jobs (docker compose run cron ...)
    mem_limit: ${FI_CRON_MEMORY:-6g}
    healthcheck:
      # One-off jobs (compose run cron ...) don't start the schedule (no /tmp/crontab)
      test: ["CMD-SHELL", "pidof supercronic || [ ! -e /tmp/crontab ]"]
      interval: 60s
      timeout: 5s
      retries: 3

  # The domain name (FI_DOMAIN) in front of the API, on the tailnet address; only with
  # COMPOSE_PROFILES=proxy (the server). Replaces `tailscale serve`, which can't use a
  # domain of its own and holds the same port.
  proxy:
    profiles: [proxy]
    build: deploy/caddy
    image: fin-intel-caddy:latest
    restart: unless-stopped
    network_mode: host  # binds the tailnet address, reaches the API on 127.0.0.1
    environment:
      FI_DOMAIN: ${FI_DOMAIN:?set FI_DOMAIN, e.g. fin-intel.external.example.com}
      FI_TAILNET_IP: ${FI_TAILNET_IP:?set FI_TAILNET_IP (tailscale ip -4)}
      FI_TAILNET_NAME: ${FI_TAILNET_NAME:?set FI_TAILNET_NAME (the node's ts.net name)}
      FI_PROXY_ALLOW: ${FI_PROXY_ALLOW:-100.64.0.0/10 fd7a:115c:a1e0::/48}
      FI_API_PORT: ${FI_API_PORT:-8000}
      FI_API_KEY: ${FI_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN (DNS edit)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FI_PROXY_DATA:-./data/caddy}:/data  # certificates and the ACME account
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    read_only: true
    tmpfs: [/tmp, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
