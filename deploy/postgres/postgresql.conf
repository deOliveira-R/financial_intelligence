# PostgreSQL in the postgres service (compose.yaml). Reachable only on the compose network.
listen_addresses = '*'
max_connections = 50
password_encryption = scram-sha-256

# Sized for the 12 GB Always Free VM (shared with the app containers)
shared_buffers = 2GB
effective_cache_size = 7GB
work_mem = 64MB
maintenance_work_mem = 1GB
max_wal_size = 8GB
checkpoint_timeout = 15min
random_page_cost = 1.1
effective_io_concurrency = 100

timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
