# PostgreSQL in the postgres service (compose.yaml). Reachable only on the compose network.
# Memory settings (shared_buffers, effective_cache_size, work_mem, maintenance_work_mem,
# max_wal_size) are passed by compose.yaml from .env, so they follow the machine.
listen_addresses = '*'
max_connections = 50
password_encryption = scram-sha-256

checkpoint_timeout = 15min
random_page_cost = 1.1
effective_io_concurrency = 100

timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
